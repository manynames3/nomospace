name: macOS safety and packaging
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Safety regression and app smoke tests
        run: scripts/test.sh
